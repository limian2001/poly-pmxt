<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>全球预测市场行情台</title>
<!--
  这个文件只负责「外壳 + 样式」，一行业务逻辑都没有。
  真正的界面在 ./js/app.js（再往下拆成 board.js / detail.js / lib.js / preact.js）。

  配色沿用国内行情软件的习惯：**红涨绿跌**（同花顺口径，和欧美股票软件相反）。
  这一条贯穿全站 —— 涨跌幅、盘口买卖档、成交方向、价格跳动闪烁，都按这个来。
  想改回绿涨红跌只需要动下面 .up / .dn 两条，别去 JS 里改。
-->
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b2230; --panel3:#212a3a;
    --border:#252d3b; --border2:#33405a;
    --fg:#e6ebf2; --mut:#8b96a7; --dim:#6b7688;
    --acc:#4f8cff; --grn:#31c48d; --red:#f0616d; --amb:#e6b53f;
    --hdr:52px;          /* 顶栏高度，表头 sticky 要减掉它 */
    --row1:26px;         /* 表头第一层高度，第二层 sticky 要偏移这么多 */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#2b3444;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#3a465c}

  /* ── 通用原子 ─────────────────────────────────────────────────────── */
  .grow{flex:1}
  .mut{color:var(--mut)}
  .dim{color:var(--dim)}
  .small{font-size:11.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .l{text-align:left}
  /* 红涨绿跌 —— 整个站点唯一的涨跌配色来源 */
  .up{color:var(--red)}
  .dn{color:var(--grn)}
  .flat{color:var(--mut)}
  .warn{color:var(--amb)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .vdot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:1px}
  .empty,.none{color:var(--mut);text-align:center;padding:34px 12px}
  .err{color:var(--red);background:rgba(240,97,109,.08);border:1px solid rgba(240,97,109,.3);
       border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12.5px}

  .btn{background:var(--acc);border:1px solid var(--acc);color:#fff;padding:6px 12px;
       border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .btn.ghost{background:var(--panel2);border-color:var(--border);color:var(--fg)}
  .btn.ghost:hover:not(:disabled){border-color:var(--border2);background:var(--panel3)}
  .btn.xs{padding:3px 9px;font-size:11.5px}
  .btn:disabled{opacity:.45;cursor:default}

  .chip{font-size:11.5px;border:1px solid var(--border);border-radius:7px;padding:4px 9px;
        cursor:pointer;color:var(--mut);background:var(--panel);user-select:none;white-space:nowrap}
  .chip:hover{border-color:var(--border2);color:var(--fg)}
  .chip.on{border-color:var(--acc);color:var(--fg);background:rgba(79,140,255,.14)}

  .badge{font-size:10.5px;line-height:16px;border:1px solid var(--border);border-radius:4px;
         padding:0 5px;color:var(--mut);background:var(--panel2);white-space:nowrap}
  .badge.cat{border-color:#33405a;color:#a9b6cb}
  .badge.end{border-color:rgba(240,97,109,.45);color:var(--red);background:rgba(240,97,109,.1);margin-left:6px}

  input,select{background:var(--panel);border:1px solid var(--border);color:var(--fg);
               padding:6px 9px;border-radius:7px;font-size:12.5px;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  input::placeholder{color:var(--dim)}

  /* 分段按钮组（主榜/其他平台独有、K 线周期）*/
  .segs{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
  .segs button{background:transparent;border:none;color:var(--mut);padding:4px 11px;
               border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
  .segs button:hover{color:var(--fg)}
  .segs button.on{background:var(--panel3);color:var(--fg)}
  .segs.big button{padding:6px 16px;font-size:13px}

  /* ── 顶栏 ─────────────────────────────────────────────────────────── */
  #app>header{
    display:flex;align-items:center;gap:10px;height:var(--hdr);padding:0 16px;
    border-bottom:1px solid var(--border);background:linear-gradient(180deg,#141a26,#0d1119);
    position:sticky;top:0;z-index:60;
  }
  #app>header h1{font-size:15px;margin:0;letter-spacing:.5px;font-weight:600;white-space:nowrap}
  .tag{font-size:11px;color:var(--mut);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .tag.warn{border-color:rgba(230,181,63,.45);color:var(--amb);background:rgba(230,181,63,.08)}
  .status{font-size:11.5px;color:var(--mut);white-space:nowrap}
  .status.ops{display:flex;gap:12px;align-items:center}

  main{padding:12px 16px 28px}
  footer{margin-top:14px;padding-top:10px;border-top:1px solid var(--border);line-height:1.7}
  footer b{color:var(--fg)}

  /* ── 筛选栏 ───────────────────────────────────────────────────────── */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .filters .search{min-width:230px;flex:0 1 300px}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .meta{display:flex;align-items:center;gap:10px;margin:0 2px 8px;font-size:12px;color:var(--mut)}
  .meta b{color:var(--fg)}
  .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}

  /* ── 行情主表 ─────────────────────────────────────────────────────── */
  .wrap{
    position:relative;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    overflow:auto;max-height:calc(100vh - var(--hdr) - 168px);min-height:320px;
  }
  table.board{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
  .board th,.board td{
    padding:5px 9px;border-bottom:1px solid var(--border);white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .board th{
    position:sticky;background:#10151e;color:var(--mut);font-weight:600;
    text-align:right;z-index:20;height:var(--row1);
  }
  .board thead tr:first-child th{top:0}
  .board thead tr.h2 th{top:var(--row1)}
  .board th.l{text-align:left}
  .board th.sortable{cursor:pointer;user-select:none}
  .board th.sortable:hover{color:var(--fg)}
  .board th.on{color:var(--acc)}
  .board th i{font-style:normal;font-size:9px;margin-left:3px}
  /* 正向 / 反向 两个分组 */
  .board th.grp{text-align:center;font-size:12px;color:#b6c2d4;border-bottom:1px solid var(--border2)}
  .board th.grp .mut{font-weight:400;font-size:10.5px;margin-left:4px}
  .board th.grp.pos{background:#161219}
  .board th.grp.neg{background:#101a19}
  .board th.vh{text-align:center;font-size:11px;font-weight:600;letter-spacing:.3px}
  .board th.vh.pos{background:#141017}
  .board th.vh.neg{background:#0e1817}
  /* 分组之间画一道竖线，眼睛不会串组 */
  .board th.grp.pos+th.grp.neg,
  .board th.vh.pos+th.vh.neg,
  .board td.px.pos+td.px.neg{border-left:1px solid var(--border2)}

  /* 「标的」列钉在左边，横向滚动时不丢上下文 */
  .board th.l:first-child,.board td.tt{
    position:sticky;left:0;background:var(--panel);z-index:25;
    max-width:430px;min-width:300px;
  }
  .board th.l:first-child{background:#10151e;z-index:40}
  .board td.tt{border-right:1px solid var(--border)}

  .board tbody tr.r:hover>td{background:#161d2b}
  .board tbody tr.r:hover>td.tt{background:#182031}
  .board tr.r.sel>td{background:#17203040}
  .board tr.r.sel>td.tt{box-shadow:inset 2px 0 0 var(--acc)}
  .board tr.r.ended>td{opacity:.55}
  .board tr.r.ch>td{background:#0f141d;font-size:12px}
  .board tr.r.ch:hover>td{background:#151d2a}
  .board tr.r.ch>td.tt{background:#0f141d}
  .board tr.r.ch:hover>td.tt{background:#161f2d}
  .board tr.r.multi>td.tt{cursor:pointer}
  .board td.none{border-bottom:none}

  /* 标的名称格 */
  .board td.tt{display:table-cell}
  .tg{width:18px;height:18px;flex:none;background:transparent;border:1px solid var(--border);
      border-radius:4px;color:var(--mut);cursor:pointer;font-size:10px;line-height:1;padding:0;
      display:inline-block;vertical-align:top;margin-right:6px}
  .tg:hover{border-color:var(--acc);color:var(--fg)}
  .tg.on{color:var(--acc);border-color:var(--acc)}
  .tg.ph{border-color:transparent;cursor:default;background:none}
  .tw{display:inline-block;vertical-align:top;max-width:calc(100% - 26px)}
  .tw .nm.zh{cursor:help}   /* 中文为主、悬停看英文：给个提示光标，不然没人知道能 hover */
  .tw .nm{font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .tw .sub{display:flex;gap:5px;align-items:center;margin-top:2px;overflow:hidden}
  .lead{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board td.tt.child{padding-left:9px}
  .ind{display:inline-block;width:22px;height:11px;margin-right:4px;vertical-align:middle;
       border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);border-radius:0 0 0 3px}
  .board td.tt.child .nm{display:inline;font-size:12px;color:#cfd8e6}
  .vs{font-size:10.5px;color:var(--dim);margin-left:6px}

  /* 价格格 */
  .board td.px{
    position:relative;text-align:right;cursor:pointer;font-variant-numeric:tabular-nums;
    font-size:12.5px;font-weight:600;
  }
  .board td.px.pos{background:rgba(240,97,109,.035)}
  .board td.px.neg{background:rgba(49,196,141,.03)}
  .board td.px:hover{outline:1px solid var(--acc);outline-offset:-1px}
  .board td.px.empty{color:#4d5769;font-weight:400;cursor:default}
  .board td.px.empty:hover{outline:none}
  .board td.px.part .v{color:var(--amb);font-weight:500}
  .board td.px .mk{font-size:9.5px;color:var(--dim);margin-left:2px;vertical-align:2px}
  .board td.px.hasLive::after{
    content:'';position:absolute;top:3px;right:3px;width:4px;height:4px;
    border-radius:50%;background:var(--acc);opacity:.6;
  }
  /* 价格跳动闪一下：涨红、跌绿。用 inset 阴影不动背景，免得把分组底色冲掉 */
  .board td.px.fu{animation:fu .8s ease-out}
  .board td.px.fd{animation:fd .8s ease-out}
  @keyframes fu{0%{box-shadow:inset 0 0 0 40px rgba(240,97,109,.34)}100%{box-shadow:inset 0 0 0 40px rgba(240,97,109,0)}}
  @keyframes fd{0%{box-shadow:inset 0 0 0 40px rgba(49,196,141,.30)}100%{box-shadow:inset 0 0 0 40px rgba(49,196,141,0)}}
  .board td.when{color:var(--mut);font-size:11.5px}

  /* ── 悬停盘口浮层 ─────────────────────────────────────────────────── */
  /* 坐标是 getBoundingClientRect 算的视口坐标，所以必须 fixed */
  .bookpop{
    position:fixed;z-index:80;background:var(--panel2);border:1px solid var(--border2);
    border-radius:9px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.55);pointer-events:none;
    font-size:11.5px;
  }
  .bk-h{display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:5px}
  .bk-h b{font-size:12px;font-weight:600}
  .bk-h .mut{margin-left:auto;font-size:11px}
  .bk-b{display:flex;flex-direction:column;gap:1px}
  .bk-l{position:relative;display:flex;align-items:center;gap:8px;padding:1px 4px;border-radius:3px}
  .bk-bar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;z-index:0}
  /* 买盘推价上行 → 红；卖盘压价下行 → 绿 */
  .bk-bar.bid{background:rgba(240,97,109,.16)}
  .bk-bar.ask{background:rgba(49,196,141,.14)}
  .bk-p{position:relative;z-index:1;font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
  .bk-p.bid{color:var(--red)}
  .bk-p.ask{color:var(--grn)}
  .bk-s{position:relative;z-index:1;margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
  .bk-mid{display:flex;justify-content:space-between;gap:8px;padding:3px 4px;margin:2px 0;
          color:var(--amb);border-top:1px dashed var(--border);border-bottom:1px dashed var(--border)}
  .bk-empty{color:var(--mut);padding:10px 4px;text-align:center}
  .bk-f{margin-top:6px;padding-top:5px;border-top:1px solid var(--border);font-size:10.5px}

  /* ── 详情抽屉 ─────────────────────────────────────────────────────── */
  .scrim{position:fixed;inset:0;background:rgba(4,7,12,.6);z-index:90;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(1060px,94vw);z-index:100;
    background:var(--bg);border-left:1px solid var(--border2);
    box-shadow:-18px 0 48px rgba(0,0,0,.5);display:flex;flex-direction:column;
    animation:slide .18s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes slide{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
  .drawer>header{
    display:flex;align-items:flex-start;gap:12px;padding:14px 16px 10px;
    border-bottom:1px solid var(--border);background:var(--panel);
  }
  .dt{min-width:0;flex:1}
  .dtitle{font-size:16px;font-weight:600;line-height:1.35}
  .dsub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:11.5px}
  .drawer .x{background:var(--panel2);border:1px solid var(--border);color:var(--mut);
             width:28px;height:28px;border-radius:7px;cursor:pointer;flex:none;font-size:13px;line-height:1}
  .drawer .x:hover{color:var(--fg);border-color:var(--border2)}
  .derr{margin:10px 16px 0;color:var(--red);font-size:12.5px}
  .drawer .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px 0}
  .drawer .chips b{font-variant-numeric:tabular-nums;color:var(--fg)}
  .dtabs{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border)}
  .dtabs>button{background:transparent;border:1px solid transparent;color:var(--mut);
                padding:5px 13px;border-radius:7px;cursor:pointer;font-size:13px}
  .dtabs>button:hover{color:var(--fg)}
  .dtabs>button.on{background:var(--panel2);color:var(--fg);border-color:var(--border)}
  .vlink{font-size:11.5px;color:var(--mut);border:1px solid var(--border);border-radius:6px;
         padding:3px 8px;white-space:nowrap}
  .vlink:hover{color:var(--fg);border-color:var(--border2);text-decoration:none}
  .dbody{flex:1;overflow:auto;padding:14px 16px 28px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start}

  /* K 线 */
  .chart{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px}
  .chart svg{display:block;width:100%}
  .chart .gl{stroke:var(--border);stroke-width:1}
  .chart .ax{fill:var(--dim);font-size:10px}
  .chart .cross{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 3}
  .legend{display:flex;flex-wrap:wrap;gap:14px;padding:6px 4px 2px;font-size:11.5px}
  .lg{display:inline-flex;align-items:center;gap:5px}
  .lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .lg b{font-variant-numeric:tabular-nums}

  /* 盘口 / 成交 分栏 */
  .vbook,.vtrades{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px}
  .vb-h{display:flex;align-items:center;gap:6px;font-size:12.5px;padding-bottom:8px;
        border-bottom:1px solid var(--border);margin-bottom:8px}
  .vb-h .ext{margin-left:auto;font-size:11.5px}
  .vbook .bk-l{font-size:12px;padding:2px 5px}
  .vbook .bk-b{gap:1px}

  table.mini{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  table.mini th,table.mini td{padding:3px 7px;border-bottom:1px solid var(--border);
                              text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.mini th{color:var(--mut);font-weight:600}
  table.mini th.l,table.mini td.l{text-align:left}
  table.mini td.mono{max-width:230px;overflow:hidden;text-overflow:ellipsis}

  /* F10 */
  .f10{display:flex;flex-direction:column;gap:16px;max-width:960px}
  .f10 section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .f10 h4{margin:0 0 8px;font-size:13px;font-weight:600;color:#c3cddd}
  .f10 dl{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin:0;font-size:12.5px}
  .f10 dt{color:var(--mut)}
  .f10 dd{margin:0;overflow-wrap:anywhere}
  .f10 p{margin:6px 0 0}
  .hbar{display:inline-block;height:7px;border-radius:3px;background:linear-gradient(90deg,#2b6fe0,#4f8cff);
        vertical-align:1px;margin-right:6px;min-width:2px}
  .mini-btn{background:var(--panel2);border:1px solid var(--border);color:var(--mut);
            border-radius:5px;padding:1px 7px;font-size:11px;cursor:pointer;margin-left:6px}
  .mini-btn:hover{color:var(--fg);border-color:var(--border2)}
  .ext{color:var(--acc)}

  /* 窄屏：抽屉铺满，主表允许更矮 */
  @media (max-width:820px){
    #app>header{gap:6px;padding:0 10px}
    #app>header .tag{display:none}
    main{padding:10px 8px 24px}
    .drawer{width:100vw}
    .wrap{max-height:calc(100vh - var(--hdr) - 210px)}
    .board th.l:first-child,.board td.tt{min-width:200px;max-width:240px}
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;color:#8b96a7">这个页面需要 JavaScript。</p></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
